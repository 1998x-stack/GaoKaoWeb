name: Verify GaoKao Atlas
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and built website
        run: npm run verify
      - name: Upload built website for preview
        uses: actions/upload-artifact@v4
        with:
          name: gaokao-atlas-preview
          path: dist
          retention-days: 7
