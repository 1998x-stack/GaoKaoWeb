name: Verify GaoKao Atlas
on:
  pull_request:
    branches: [main, feat/knowledge-hub-rebuild, feat/v1.1-source-governance]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF inspection tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Audit committed PDF evidence against original files
        run: npm run audit:pdf
      - name: Validate source and built website
        run: npm run verify
      - name: Upload built website for preview
        uses: actions/upload-artifact@v4
        with:
          name: gaokao-atlas-preview
          path: dist
          retention-days: 7
